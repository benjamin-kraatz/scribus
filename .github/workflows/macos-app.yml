name: Build macOS Scribus App

on:
  workflow_dispatch:
  push:
    branches:
      - benn/learn-codebase
    paths:
      - '.github/workflows/macos-app.yml'
      - 'CMakeLists.txt'
      - 'CMakeLists_Dependencies.cmake'
      - 'cmake/**'
      - 'scribus/**'
      - 'resources/**'

jobs:
  build-macos-app:
    runs-on: macos-14
    timeout-minutes: 120

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Homebrew download cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('.github/workflows/macos-app.yml') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', 'CMakeLists_Dependencies.cmake', '.github/workflows/macos-app.yml', 'scribus/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install dependencies
        run: |
          deps=(
            cmake
            ninja
            pkg-config
            ccache
            icu4c
            qt@6
            cairo
            freetype
            harfbuzz
            libxml2
            libpng
            jpeg-turbo
            libtiff
            little-cms2
            poppler
            podofo
            hunspell
            fontconfig
            boost
          )

          missing=()
          for dep in "${deps[@]}"; do
            if ! brew list --versions "$dep" >/dev/null 2>&1; then
              missing+=("$dep")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Installing missing dependencies: ${missing[*]}"
            brew install "${missing[@]}"
          else
            echo "All dependencies already present"
          fi

      - name: Configure (Debug)
        run: |
          BREW_PREFIX="$(brew --prefix)"
          QT_PREFIX="$(brew --prefix qt@6)"
          LIBPNG_PREFIX="$(brew --prefix libpng)"
          ICU4C_PREFIX="$(brew --prefix icu4c)"

          export PKG_CONFIG_PATH="$ICU4C_PREFIX/lib/pkgconfig:$QT_PREFIX/lib/pkgconfig:$LIBPNG_PREFIX/lib/pkgconfig:$BREW_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          ccache -M 2G || true
          ccache -s || true

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DQT_PREFIX="$QT_PREFIX" \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX/lib/cmake;$ICU4C_PREFIX;$BREW_PREFIX" \
            -DCMAKE_INCLUDE_PATH="$BREW_PREFIX/include;$LIBPNG_PREFIX/include;$LIBPNG_PREFIX/include/libpng16" \
            -DCMAKE_LIBRARY_PATH="$BREW_PREFIX/lib" \
            -DPNG_PNG_INCLUDE_DIR="$LIBPNG_PREFIX/include/libpng16" \
            -DPNG_LIBRARY="$LIBPNG_PREFIX/lib/libpng.dylib" \
            -DAPPLEBUNDLE=ON \
            -DWANT_NOOSG=1 \
            -DWANT_GRAPHICSMAGICK=0

      - name: Build
        run: |
          cmake --build build --parallel
          cmake --install build --config Release --prefix build/install
          ccache -s || true

      - name: Create app bundle with macdeployqt
        run: |
          QT_PREFIX="$(brew --prefix qt@6)"
          
          # Create app bundle directory structure
          mkdir -p Scribus.app/Contents/{MacOS,Resources}
          
          # Copy the executable
          cp build/install/MacOS/Scribus* Scribus.app/Contents/MacOS/scribus || true
          
          # Get the actual executable name 
          EXE_NAME=$(ls build/install/MacOS/ | head -1)
          if [ -z "$EXE_NAME" ]; then
            echo "No executable found in build/install/MacOS"
            exit 1
          fi
          
          cp "build/install/MacOS/$EXE_NAME" "Scribus.app/Contents/MacOS/$EXE_NAME"
          
          # Create basic Info.plist
          cat > Scribus.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>scribus</string>
              <key>CFBundleIdentifier</key>
              <string>org.scribus.Scribus</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Scribus</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.7.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
          </dict>
          </plist>
          EOF
          
          # Use macdeployqt to deploy Qt dependencies
          "$QT_PREFIX/libexec/macdeployqt" Scribus.app -always-overwrite

      - name: Collect app bundle
        run: |
          if [ ! -d "Scribus.app" ]; then
            echo "Scribus.app not found"
            exit 1
          fi

          echo "App bundle ready: Scribus.app"
          mkdir -p out
          cp -R Scribus.app out/
          ditto -c -k --sequesterRsrc --keepParent "out/Scribus.app" "out/Scribus-macOS-app.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scribus-macOS-app
          path: out/Scribus-macOS-app.zip
          if-no-files-found: error
