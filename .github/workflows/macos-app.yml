name: Build macOS Scribus App

on:
  workflow_dispatch:
  push:
    branches:
      - benn/learn-codebase
    paths:
      - '.github/workflows/macos-app.yml'
      - 'CMakeLists.txt'
      - 'CMakeLists_Dependencies.cmake'
      - 'cmake/**'
      - 'scribus/**'
      - 'resources/**'

jobs:
  build-macos-app:
    runs-on: macos-14
    timeout-minutes: 120

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Homebrew download cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('.github/workflows/macos-app.yml') }}
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', 'CMakeLists_Dependencies.cmake', '.github/workflows/macos-app.yml', 'scribus/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install dependencies
        run: |
          deps=(
            cmake
            ninja
            pkg-config
            ccache
            icu4c
            qt@6
            cairo
            freetype
            harfbuzz
            libxml2
            libpng
            jpeg-turbo
            libtiff
            little-cms2
            poppler
            podofo
            hunspell
            fontconfig
            boost
          )

          missing=()
          for dep in "${deps[@]}"; do
            if ! brew list --versions "$dep" >/dev/null 2>&1; then
              missing+=("$dep")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Installing missing dependencies: ${missing[*]}"
            brew install "${missing[@]}"
          else
            echo "All dependencies already present"
          fi

      - name: Configure (Debug)
        run: |
          BREW_PREFIX="$(brew --prefix)"
          QT_PREFIX="$(brew --prefix qt@6)"
          LIBPNG_PREFIX="$(brew --prefix libpng)"
          ICU4C_PREFIX="$(brew --prefix icu4c)"
          INSTALL_PREFIX="$PWD/build/install"

          export PKG_CONFIG_PATH="$ICU4C_PREFIX/lib/pkgconfig:$QT_PREFIX/lib/pkgconfig:$LIBPNG_PREFIX/lib/pkgconfig:$BREW_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          ccache -M 2G || true
          ccache -s || true

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DQT_PREFIX="$QT_PREFIX" \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX/lib/cmake;$ICU4C_PREFIX;$BREW_PREFIX" \
            -DCMAKE_INCLUDE_PATH="$BREW_PREFIX/include;$LIBPNG_PREFIX/include;$LIBPNG_PREFIX/include/libpng16" \
            -DCMAKE_LIBRARY_PATH="$BREW_PREFIX/lib" \
            -DPNG_PNG_INCLUDE_DIR="$LIBPNG_PREFIX/include/libpng16" \
            -DPNG_LIBRARY="$LIBPNG_PREFIX/lib/libpng.dylib" \
            -DAPPLEBUNDLE=ON \
            -DWANT_NOOSG=1 \
            -DWANT_GRAPHICSMAGICK=0

      - name: Build
        run: |
          cmake --build build --parallel
          cmake --install build --config Release
          ccache -s || true

      - name: Create app bundle with macdeployqt
        run: |
          QT_PREFIX="$(brew --prefix qt@6)"
          APP_PATH="$(find build/install -maxdepth 5 -type d -name '*.app' | head -n 1 || true)"
          MACDEPLOYQT=""

          if [ -x "$QT_PREFIX/bin/macdeployqt" ]; then
            MACDEPLOYQT="$QT_PREFIX/bin/macdeployqt"
          elif [ -x "$QT_PREFIX/libexec/macdeployqt" ]; then
            MACDEPLOYQT="$QT_PREFIX/libexec/macdeployqt"
          else
            MACDEPLOYQT="$(find "$QT_PREFIX" -type f -name macdeployqt | head -n 1 || true)"
          fi

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under build/install"
            exit 1
          fi

          if [ -z "$MACDEPLOYQT" ]; then
            echo "macdeployqt not found under $QT_PREFIX"
            echo "Qt prefix contents:"
            find "$QT_PREFIX" -maxdepth 3 \( -type d -o -type f \) | sort | head -n 200
            exit 1
          fi

          echo "Using installed app bundle: $APP_PATH"
          echo "Using macdeployqt: $MACDEPLOYQT"
          "$MACDEPLOYQT" "$APP_PATH" -always-overwrite

          rm -rf out/Scribus.app
          mkdir -p out
          cp -R "$APP_PATH" out/Scribus.app

      - name: Collect app bundle
        run: |
          if [ ! -d "out/Scribus.app" ]; then
            echo "Scribus.app not found in out/"
            exit 1
          fi

          echo "App bundle ready: Scribus.app"
          ditto -c -k --sequesterRsrc --keepParent "out/Scribus.app" "out/Scribus-macOS-app.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scribus-macOS-app
          path: out/Scribus-macOS-app.zip
          if-no-files-found: error
